name: 889 Attestation (rolling)

# Publishes a stable, refreshable NDAA Section 889 attestation that a signed
# attestation letter can link to. Runs scripts/attest-889.sh in CI (so the
# private server-commercial image is included via GITHUB_TOKEN) and clobbers the
# assets on a single fixed-tag prerelease, so one permalink always serves the
# current attestation:
#
#   Human:  https://github.com/<owner>/<repo>/releases/tag/attestation-889
#   JSON:   https://github.com/<owner>/<repo>/releases/download/attestation-889/attestation.json
#
# The release is a PRERELEASE on purpose: install.sh resolves the daemon binary
# via /releases/latest/, which excludes prereleases, so this never hijacks it.
#
# Trigger it from the Actions tab before a deal to refresh the evidence; the
# monthly schedule keeps it from going stale.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to assess (the production images)'
        required: false
        default: 'latest'
  schedule:
    # 08:00 UTC on the 1st of each month
    - cron: '0 8 1 * *'

permissions:
  contents: write
  packages: read

env:
  SYFT_VERSION: v1.45.1
  ATTEST_TAG: attestation-889

jobs:
  attest:
    name: publish-889-attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate attestation bundle
        run: |
          ./scripts/attest-889.sh \
            --tag "${{ inputs.image_tag || 'latest' }}" \
            --out "$GITHUB_WORKSPACE/attestation-bundle"

      - name: Publish / refresh the rolling attestation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/attestation-bundle"
          TITLE="NDAA Section 889 Supply-Chain Attestation (rolling)"
          if gh release view "$ATTEST_TAG" >/dev/null 2>&1; then
            gh release edit "$ATTEST_TAG" --prerelease --title "$TITLE" --notes-file ATTESTATION.md
          else
            gh release create "$ATTEST_TAG" \
              --target "$GITHUB_SHA" --prerelease --title "$TITLE" --notes-file ATTESTATION.md
          fi
          gh release upload "$ATTEST_TAG" --clobber \
            attestation.json ATTESTATION.md summary.txt hits.jsonl SHA256SUMS \
            889-vendors.txt 889-allow.txt sbom-*.cdx.json

      - name: Summary
        run: |
          {
            echo "## NDAA Section 889 attestation published"
            echo ""
            echo "Stable links for the attestation letter:"
            echo ""
            echo "- Page: https://github.com/${{ github.repository }}/releases/tag/${ATTEST_TAG}"
            echo "- JSON: https://github.com/${{ github.repository }}/releases/download/${ATTEST_TAG}/attestation.json"
          } >> "$GITHUB_STEP_SUMMARY"
